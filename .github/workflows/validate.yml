name: Validate portable installer
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Validate TOML
        run: python -c "import pathlib,tomllib; [tomllib.loads(p.read_text()) for p in pathlib.Path('config/yazi').glob('*.toml')]"
      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh && bash -n config/shell/devkit.sh
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-Syntax.ps1
  office-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils
      - run: python -m unittest discover -s tests -v
        env:
          DEVKIT_INTEGRATION: '1'
